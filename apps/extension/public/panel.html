<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>shadowinput</title><link rel="icon" href="icons/icon-32.png"><link rel="stylesheet" href="theme.css"></head>
<body>
<main>
  <header><a class="brand" href="panel.html"><img src="icons/icon-32.png" alt="" width="32" height="32">shadowinput</a><select id="language"><option value="zh">简体中文</option><option value="en">English</option></select></header>
  <section class="intro"><span class="eyebrow" data-copy="preview"></span><h1 data-copy="title"></h1><p data-copy="subtitle"></p></section>
  <section class="account"><div><span class="label" data-copy="account"></span><p id="status" role="status"></p></div><button id="connect" data-copy="connect"></button><button id="logout" hidden data-copy="disconnect"></button><button id="cancel-sign-in" hidden data-copy="cancel"></button><p class="detail" data-copy="plan"></p></section>
  <form id="translation-form">
    <div class="toolbar"><label><span data-copy="target"></span><select id="target"><option value="zh-CN"></option><option value="en"></option><option value="ja"></option></select></label><label class="model"><span data-copy="model"></span><select id="model"></select></label><button id="refresh" type="button" data-copy="refresh"></button></div>
    <div class="editors"><label><span data-copy="source"></span><textarea id="source" maxlength="8000" spellcheck="false"></textarea></label><label><span data-copy="result"></span><textarea id="result" readonly></textarea></label></div>
    <div class="actions"><button id="translate" class="primary" type="submit" disabled data-copy="translate"></button><button id="cancel" type="button" hidden data-copy="cancel"></button><button id="copy" class="copy" type="button" disabled data-copy="copy"></button></div>
  </form>
  <p id="error" class="error" role="alert"></p>
  <p class="privacy" data-copy="privacy"></p>
  <details><summary data-copy="preview"></summary><p data-copy="experimental"></p><p data-copy="local"></p></details>
  <footer><span data-copy="license"></span><a href="https://github.com/simpledavid/shadowinput-desktop/tree/codex/standalone-extension/apps/extension" target="_blank" rel="noreferrer" data-copy="sourceLink"></a></footer>
</main>
<script type="module" src="app/panel.js"></script>
</body></html>
